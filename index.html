<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Hub</title>
<style>
/* ============================================================
   EDIT HERE — your tiles. Just change name / url / icon / color.
   (Config is in the <script> at the bottom: look for HUB_CONFIG)
   ============================================================ */
:root{
  --text:#f5f7fb; --muted:rgba(245,247,251,.68); --glass:rgba(255,255,255,.10);
  --glass-strong:rgba(255,255,255,.18); --line:rgba(255,255,255,.16);
  --focus:#7dd3fc; --sky1:#0f172a; --sky2:#1e3a8a; --sky3:#0ea5e9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text); background:var(--sky1); overflow:hidden;
  font-size:1.05vw; /* everything scales with screen width — looks the same on 720p/1080p/4K */
}
/* ---------- dynamic sky ---------- */
#sky{position:fixed;inset:0;z-index:-2;
  background:linear-gradient(135deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  background-size:200% 200%; animation:drift 40s ease-in-out infinite alternate;
  transition:background 2s}
@keyframes drift{from{background-position:0% 30%}to{background-position:100% 70%}}
.orb{position:fixed;border-radius:50%;z-index:-1;opacity:.35;
  background:radial-gradient(circle,rgba(255,255,255,.55),transparent 65%)}
.orb.a{width:38vw;height:38vw;top:-12vw;right:-8vw;animation:float 26s ease-in-out infinite alternate}
.orb.b{width:28vw;height:28vw;bottom:-10vw;left:-6vw;opacity:.18;animation:float 34s ease-in-out infinite alternate-reverse}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(-4vw,3vw)}}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.drop{position:absolute;top:-10vh;width:2px;height:7vh;background:linear-gradient(transparent,rgba(255,255,255,.5));animation:fall linear infinite}
.flake{position:absolute;top:-5vh;color:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh)}}

/* ---------- layout ---------- */
.wrap{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.6vw;padding:2.4vw 3.2vw}
header{display:flex;justify-content:space-between;align-items:flex-start}
#greet{font-size:1.6em;color:var(--muted);font-weight:500}
#clock{font-size:6.2em;font-weight:200;letter-spacing:-.04em;line-height:1}
#date{font-size:1.5em;color:var(--muted);margin-top:.3em}
.now{text-align:right}
.now .temp{font-size:5em;font-weight:200;line-height:1;display:flex;align-items:center;gap:.15em;justify-content:flex-end}
.now .temp .ic{font-size:.8em}
.now .cond{font-size:1.6em;margin-top:.2em}
.now .meta{font-size:1.15em;color:var(--muted);margin-top:.4em}
.now .loc{font-size:1.1em;color:var(--muted);margin-top:.2em}

main{display:grid;grid-template-columns:1.25fr 1fr;gap:1.6vw;min-height:0}
.card{background:var(--glass);border:1px solid var(--line);border-radius:1.6vw;padding:1.2vw 1.6vw;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card h2{font-size:1.05em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.8vw}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:9vw;
  border-radius:1.2vw;padding:1.2vw;text-decoration:none;color:var(--text);
  background:linear-gradient(150deg,var(--c,#334155),rgba(0,0,0,.25));
  border:2px solid transparent;outline:none;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.tile .ti{font-size:2.6em;line-height:1}
.tile .tn{font-size:1.35em;font-weight:600}
.tile .ts{font-size:.95em;color:rgba(255,255,255,.75)}
.tile:focus,.tile:hover,.btn:focus,.btn:hover{transform:scale(1.06);border-color:var(--focus);
  box-shadow:0 0 0 .35vw rgba(125,211,252,.35),0 1.2vw 2.4vw rgba(0,0,0,.35);z-index:2}

/* forecast */
.side{display:grid;grid-template-rows:auto 1fr;gap:1.6vw;min-height:0}
.hours{display:flex;justify-content:space-between}
.hour{text-align:center;font-size:1.1em}
.hour .ic{font-size:1.6em;margin:.2em 0}
.hour .t{font-weight:600}
.hour .h{color:var(--muted)}
.days{display:flex;flex-direction:column;gap:.35vw}
.day{display:grid;grid-template-columns:4.5em 2em 1fr 5em;align-items:center;gap:.8em;font-size:1.05em;white-space:nowrap}
.day .ic{font-size:1.4em;text-align:center}
.bar{height:.45em;border-radius:1em;background:rgba(255,255,255,.12);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:1em;background:linear-gradient(90deg,#7dd3fc,#fde68a,#fb923c)}
.day .lo{color:var(--muted);text-align:right}

footer{display:flex;justify-content:space-between;align-items:center;font-size:1.05em;color:var(--muted)}
.btn{background:var(--glass);border:2px solid var(--line);color:var(--text);border-radius:1em;
  padding:.55em 1.2em;font-size:1em;font-family:inherit;cursor:pointer;outline:none;transition:transform .18s}
kbd{background:var(--glass-strong);border-radius:.35em;padding:.05em .45em;font-family:inherit}

/* settings */
#settings{position:fixed;inset:0;background:rgba(2,6,23,.75);display:none;align-items:center;justify-content:center;z-index:10}
#settings.open{display:flex}
#settings .card{width:44vw;background:rgba(15,23,42,.92)}
#settings label{display:block;font-size:1.2em;margin:1em 0 .4em}
#settings input,#settings select{width:100%;font-size:1.4em;padding:.5em .7em;border-radius:.6em;border:2px solid var(--line);
  background:rgba(255,255,255,.08);color:var(--text);font-family:inherit;outline:none}
#settings input:focus,#settings select:focus{border-color:var(--focus)}
#settings select option{color:#000}
#settings .row{display:flex;gap:1em;margin-top:1.6em}
#msg{margin-top:1em;color:#fca5a5;min-height:1.2em}
.skeleton{color:var(--muted)}
</style>
</head>
<body>
<div id="sky"></div><div class="orb a"></div><div class="orb b"></div><div id="fx"></div>

<div class="wrap">
  <header>
    <div>
      <div id="greet">Good evening</div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div class="now" id="now"><div class="skeleton">Loading weather…</div></div>
  </header>

  <main>
    <section class="card">
      <h2>Quick launch</h2>
      <div class="tiles" id="tiles"></div>
    </section>
    <div class="side">
      <section class="card">
        <h2>Next hours</h2>
        <div class="hours" id="hours"><span class="skeleton">…</span></div>
      </section>
      <section class="card" style="min-height:0">
        <h2>7-day forecast</h2>
        <div class="days" id="days"><span class="skeleton">…</span></div>
      </section>
    </div>
  </main>

  <footer>
    <div>Use <kbd>◀ ▶ ▲ ▼</kbd> or point with the Magic Remote, <kbd>OK</kbd> to open · weather by Open-Meteo (free, no account)</div>
    <button class="btn" id="openSettings">⚙ Settings</button>
  </footer>
</div>

<div id="settings">
  <div class="card">
    <h2>Hub settings</h2>
    <label for="city">Your city or ZIP</label>
    <input id="city" placeholder="e.g. Austin, TX">
    <label for="units">Temperature</label>
    <select id="units"><option value="fahrenheit">°F</option><option value="celsius">°C</option></select>
    <div class="row">
      <button class="btn" id="save">Save</button>
      <button class="btn" id="cancel">Cancel</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<script>
/* ============================================================
   HUB_CONFIG — the only part you need to edit.
   ============================================================ */
var HUB_CONFIG = {
  city: "",                // leave "" to be asked on first launch
  units: "fahrenheit",     // or "celsius"
  clock24h: false,
  tiles: [
    { name:"Tesla",        sub:"Account & vehicle", icon:"⚡", color:"#b91c1c", url:"https://www.tesla.com/teslaaccount" },
    { name:"YouTube",      sub:"TV mode",           icon:"▶",  color:"#dc2626", url:"https://www.youtube.com/tv" },
    { name:"Radar",        sub:"Live weather map",  icon:"🌧", color:"#0369a1", url:"https://www.windy.com" },
    { name:"News",         sub:"Top stories",       icon:"📰", color:"#4338ca", url:"https://news.google.com" },
    { name:"Calendar",     sub:"Today's plans",     icon:"📅", color:"#0f766e", url:"https://calendar.google.com" },
    { name:"Photos",       sub:"Memories",          icon:"🖼", color:"#a16207", url:"https://photos.google.com" }
  ]
};

/* ---------- storage (safe even if the TV blocks it) ---------- */
function load(k,d){try{var v=localStorage.getItem("hub."+k);return v===null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem("hub."+k,v)}catch(e){}}
var state={city:load("city",HUB_CONFIG.city),units:load("units",HUB_CONFIG.units),lat:load("lat",""),lon:load("lon",""),place:load("place","")};

/* ---------- clock ---------- */
function pad(n){return n<10?"0"+n:""+n}
function tick(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes(),s;
  if(HUB_CONFIG.clock24h){s=pad(h)+":"+pad(m)}else{s=((h%12)||12)+":"+pad(m)}
  document.getElementById("clock").textContent=s;
  document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  document.getElementById("greet").textContent=h<5?"Good night":h<12?"Good morning":h<18?"Good afternoon":"Good evening";
}
tick();setInterval(tick,10000);

/* ---------- tiles ---------- */
var tilesEl=document.getElementById("tiles");
HUB_CONFIG.tiles.forEach(function(t){
  var a=document.createElement("a");a.className="tile";a.href=t.url;a.style.setProperty("--c",t.color);
  a.innerHTML='<div class="ti">'+t.icon+'</div><div><div class="tn">'+t.name+'</div><div class="ts">'+t.sub+'</div></div>';
  tilesEl.appendChild(a);
});

/* ---------- weather ---------- */
var WMO={0:["Clear","☀️","🌙"],1:["Mostly clear","🌤","🌙"],2:["Partly cloudy","⛅","☁️"],3:["Overcast","☁️","☁️"],
45:["Fog","🌫","🌫"],48:["Fog","🌫","🌫"],51:["Light drizzle","🌦","🌧"],53:["Drizzle","🌦","🌧"],55:["Heavy drizzle","🌧","🌧"],
61:["Light rain","🌦","🌧"],63:["Rain","🌧","🌧"],65:["Heavy rain","🌧","🌧"],66:["Freezing rain","🌧","🌧"],67:["Freezing rain","🌧","🌧"],
71:["Light snow","🌨","🌨"],73:["Snow","🌨","🌨"],75:["Heavy snow","❄️","❄️"],77:["Snow grains","🌨","🌨"],
80:["Showers","🌦","🌧"],81:["Showers","🌧","🌧"],82:["Heavy showers","⛈","⛈"],85:["Snow showers","🌨","🌨"],86:["Snow showers","❄️","❄️"],
95:["Thunderstorm","⛈","⛈"],96:["Thunderstorm","⛈","⛈"],99:["Thunderstorm","⛈","⛈"]};
function wx(code,day){var w=WMO[code]||["—","🌡","🌡"];return{text:w[0],icon:day?w[1]:w[2]}}

function getJSON(url,cb,err){
  var x=new XMLHttpRequest();x.open("GET",url);x.timeout=15000;
  x.onload=function(){if(x.status>=200&&x.status<300){try{cb(JSON.parse(x.responseText))}catch(e){err&&err(e)}}else{err&&err(x.status)}};
  x.onerror=x.ontimeout=function(){err&&err("network")};x.send();
}

function geocode(q,ok,fail){
  getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name="+encodeURIComponent(q.split(",")[0].trim()),function(r){
    if(!r.results||!r.results.length)return fail("Couldn't find that place — try just the city name.");
    var p=r.results[0];ok(p.latitude,p.longitude,p.name+(p.admin1?", "+p.admin1:""));
  },function(){fail("No internet connection?")});
}

function loadWeather(){
  if(!state.lat){openSettings();return}
  var u=state.units==="celsius"?"celsius":"fahrenheit",wu=u==="celsius"?"kmh":"mph";
  getJSON("https://api.open-meteo.com/v1/forecast?latitude="+state.lat+"&longitude="+state.lon+
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day"+
    "&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset"+
    "&temperature_unit="+u+"&wind_speed_unit="+wu+"&timezone=auto&forecast_days=7",render,function(){
      document.getElementById("now").innerHTML='<div class="skeleton">Weather unavailable — retrying soon</div>';
    });
}

function render(d){
  var c=d.current,w=wx(c.weather_code,c.is_day),R=Math.round,unit=state.units==="celsius"?"C":"F";
  document.getElementById("now").innerHTML=
    '<div class="temp"><span class="ic">'+w.icon+'</span>'+R(c.temperature_2m)+'°</div>'+
    '<div class="cond">'+w.text+'</div>'+
    '<div class="meta">Feels '+R(c.apparent_temperature)+'° · Humidity '+c.relative_humidity_2m+'% · Wind '+R(c.wind_speed_10m)+' '+(unit==="C"?"km/h":"mph")+'</div>'+
    '<div class="loc">📍 '+state.place+'</div>';

  // next 8 hours (every hour starting now)
  var now=Date.now(),start=0;
  while(start<d.hourly.time.length-1&&new Date(d.hourly.time[start+1]).getTime()<=now)start++;
  var h="";
  for(var i=start;i<start+8&&i<d.hourly.time.length;i++){
    var t=new Date(d.hourly.time[i]),hw=wx(d.hourly.weather_code[i],d.hourly.is_day[i]);
    var lbl=i===start?"Now":(HUB_CONFIG.clock24h?pad(t.getHours()):(((t.getHours()%12)||12)+(t.getHours()<12?"a":"p")));
    h+='<div class="hour"><div class="h">'+lbl+'</div><div class="ic">'+hw.icon+'</div><div class="t">'+R(d.hourly.temperature_2m[i])+'°</div></div>';
  }
  document.getElementById("hours").innerHTML=h;

  // 7 days with range bars
  var mn=Math.min.apply(null,d.daily.temperature_2m_min),mx=Math.max.apply(null,d.daily.temperature_2m_max),span=(mx-mn)||1,s="";
  for(var j=0;j<d.daily.time.length;j++){
    var dd=new Date(d.daily.time[j]+"T12:00"),dw=wx(d.daily.weather_code[j],1),lo=d.daily.temperature_2m_min[j],hi=d.daily.temperature_2m_max[j];
    s+='<div class="day"><div>'+(j===0?"Today":dd.toLocaleDateString(undefined,{weekday:"short"}))+'</div><div class="ic">'+dw.icon+'</div>'+
       '<div class="bar"><i style="left:'+((lo-mn)/span*100)+'%;right:'+((mx-hi)/span*100)+'%"></i></div>'+
       '<div class="lo">'+R(lo)+'° <b style="color:var(--text)">'+R(hi)+'°</b></div></div>';
  }
  document.getElementById("days").innerHTML=s;
  paintSky(c.weather_code,c.is_day);
}

/* ---------- background reacts to weather + time ---------- */
function paintSky(code,isDay){
  var r=document.documentElement.style,hr=new Date().getHours(),p;
  var dusk=(hr>=17&&hr<20)||(hr>=5&&hr<8);
  if(!isDay)p=["#020617","#1e1b4b","#312e81"];
  else if(code>=95)p=["#111827","#374151","#4b5563"];
  else if(code>=51)p=["#1e293b","#334155","#475569"];
  else if(code>=45||code===3)p=["#334155","#64748b","#94a3b8"];
  else if(dusk)p=["#4c1d95","#be185d","#f59e0b"];
  else p=["#0c4a6e","#0369a1","#38bdf8"];
  r.setProperty("--sky1",p[0]);r.setProperty("--sky2",p[1]);r.setProperty("--sky3",p[2]);
  var fx=document.getElementById("fx");fx.innerHTML="";
  var snow=(code>=71&&code<=77)||code===85||code===86,rain=!snow&&code>=51;
  if(rain||snow){
    for(var i=0;i<(snow?40:60);i++){
      var e=document.createElement("div");e.className=snow?"flake":"drop";
      if(snow){e.textContent="•";e.style.fontSize=(0.6+Math.random()*1.2)+"vw"}
      e.style.left=Math.random()*100+"vw";
      e.style.animationDuration=(snow?6+Math.random()*6:0.7+Math.random()*0.6)+"s";
      e.style.animationDelay=(-Math.random()*8)+"s";
      fx.appendChild(e);
    }
  }
}

/* ---------- settings ---------- */
var panel=document.getElementById("settings");
function openSettings(){
  document.getElementById("city").value=state.city;document.getElementById("units").value=state.units;
  document.getElementById("msg").textContent="";panel.className="open";
  setTimeout(function(){document.getElementById("city").focus()},50);
}
function closeSettings(){panel.className="";focusFirst()}
document.getElementById("openSettings").onclick=openSettings;
document.getElementById("cancel").onclick=closeSettings;
document.getElementById("save").onclick=function(){
  var q=document.getElementById("city").value.trim(),u=document.getElementById("units").value;
  if(!q){document.getElementById("msg").textContent="Type a city first.";return}
  document.getElementById("msg").textContent="Looking up "+q+"…";
  geocode(q,function(lat,lon,place){
    state.city=q;state.units=u;state.lat=lat;state.lon=lon;state.place=place;
    save("city",q);save("units",u);save("lat",lat);save("lon",lon);save("place",place);
    closeSettings();loadWeather();
  },function(m){document.getElementById("msg").textContent=m});
};

/* ---------- remote-control navigation (arrow keys + OK) ---------- */
function focusables(){
  var root=panel.className==="open"?panel:document;
  return [].slice.call(root.querySelectorAll(".tile,.btn,input,select"));
}
function focusFirst(){var f=document.querySelector(".tile");f&&f.focus()}
document.addEventListener("keydown",function(e){
  var k=e.keyCode,dir={37:"l",38:"u",39:"r",40:"d"}[k];
  if(k===461||k===10009||k===27){if(panel.className==="open"){closeSettings();e.preventDefault()}return} // LG BACK (461) / Esc
  if(!dir)return;
  var cur=document.activeElement;
  if(cur&&cur.tagName==="SELECT"&&(dir==="u"||dir==="d"))return;
  var items=focusables();if(!items.length)return;
  if(!cur||items.indexOf(cur)<0){items[0].focus();e.preventDefault();return}
  var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bs=1e9;
  items.forEach(function(el){
    if(el===cur)return;var b=el.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay;
    var ok=dir==="l"?dx<-5:dir==="r"?dx>5:dir==="u"?dy<-5:dy>5;if(!ok)return;
    var main=(dir==="l"||dir==="r")?Math.abs(dx):Math.abs(dy),off=(dir==="l"||dir==="r")?Math.abs(dy):Math.abs(dx);
    var sc=main+off*2.5;if(sc<bs){bs=sc;best=el}
  });
  if(best){best.focus();e.preventDefault()}
});

focusFirst();
if(state.lat){loadWeather()}else{openSettings()}
setInterval(loadWeather,15*60*1000); // refresh every 15 min
</script>
</body>
</html>
