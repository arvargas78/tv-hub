<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Hub</title>
<style>
:root{
  --bg:#06080c; --card:rgba(22,27,36,.72); --card-line:rgba(255,255,255,.07);
  --text:#f3f5f9; --muted:rgba(243,245,249,.55); --faint:rgba(243,245,249,.32);
  --accent:#7dd3fc; --glow1:rgba(56,189,248,.20); --glow2:rgba(129,140,248,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;font-size:1vw;-webkit-font-smoothing:antialiased}

/* ---------- background: two soft glows that follow the time of day ---------- */
.glow{position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
.glow.a{width:70vw;height:70vw;top:-35vw;left:-15vw;background:radial-gradient(circle,var(--glow1),transparent 62%);animation:driftA 38s ease-in-out infinite alternate}
.glow.b{width:60vw;height:60vw;bottom:-30vw;right:-12vw;background:radial-gradient(circle,var(--glow2),transparent 62%);animation:driftB 46s ease-in-out infinite alternate}
@keyframes driftA{to{transform:translate(8vw,4vw)}}
@keyframes driftB{to{transform:translate(-6vw,-5vw)}}

/* ---------- layout ---------- */
.wrap{height:100vh;display:flex;flex-direction:column;padding:2.2vw 2.6vw 1.4vw;gap:1.8vw}
.top{display:grid;grid-template-columns:1fr;flex:1;min-height:0}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:1.8vw;
  box-shadow:0 1.4vw 3vw rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);min-height:0;overflow:hidden}
.label{font-size:.95em;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* clock widget */
.clock{display:flex;flex-direction:column;justify-content:space-between;padding:2vw 2vw}
#greet{font-size:1.45em;color:var(--muted)}
.time{display:flex;align-items:flex-start;line-height:.9}
#hm{font-size:7.4em;font-weight:200;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
#sec{font-size:2em;font-weight:300;color:var(--accent);margin:.7vw 0 0 .5vw;font-variant-numeric:tabular-nums}
#ampm{font-size:1.5em;color:var(--muted);font-weight:500;margin-top:.8vw}
#day{font-size:2em;font-weight:600;margin-top:1.4vw}
#date{font-size:1.5em;color:var(--muted);margin-top:.2vw}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.35vw;font-size:.95em;text-align:center;color:var(--muted)}
.cal .h{color:var(--faint);font-weight:600;font-size:.85em}
.cal .t{background:var(--accent);color:#06080c;border-radius:50%;font-weight:700}
.cal .o{opacity:.25}

/* live portal panel */
.portal{position:relative;display:block;outline:none;text-decoration:none;color:var(--text);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.portal iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;pointer-events:none;background:#071528}
.portal .hint{position:absolute;right:1.2vw;bottom:1.1vw;z-index:2;background:rgba(6,8,12,.78);border:1px solid rgba(255,255,255,.18);
  border-radius:1em;padding:.45em 1em;font-size:1.05em;font-weight:600;opacity:0;transition:opacity .2s}
.portal.on,.portal:focus,.portal:hover{transform:scale(1.012);box-shadow:0 2vw 4vw rgba(0,0,0,.6),0 0 0 .25vw rgba(255,255,255,.85),0 0 2.4vw .3vw rgba(73,184,255,.35)}
.portal.on .hint,.portal:focus .hint,.portal:hover .hint{opacity:1}
.portal .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:1.3em}

/* ---------- floating app icons (one row) ---------- */
.apps{display:flex;justify-content:space-between;align-items:flex-start;padding:0 .6vw;height:12.4vw}
.app{display:flex;flex-direction:column;align-items:center;gap:.8vw;text-decoration:none;color:var(--text);outline:none;padding-top:1vw}
.ico{position:relative;width:7.2vw;height:7.2vw;border-radius:1.8vw;display:flex;align-items:center;justify-content:center;
  background:var(--bg-app,#222);
  box-shadow:0 1.4vw 2.4vw rgba(0,0,0,.55),0 .35vw .7vw rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.25);
  animation:float 6s ease-in-out infinite;animation-delay:var(--d,0s);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.ico::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.ico svg{width:58%;height:58%;position:relative;z-index:1}
.ico .word{position:relative;z-index:1;font-weight:800;letter-spacing:-.02em;color:#fff}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.4vw)}}
.name{font-size:1.1em;font-weight:500;color:var(--muted);transition:color .2s;white-space:nowrap}
.key{position:absolute;top:-.55vw;right:-.55vw;z-index:2;background:rgba(10,12,16,.85);border:1px solid rgba(255,255,255,.18);
  color:var(--muted);font-size:.75em;font-weight:600;border-radius:1em;padding:.15em .5em;opacity:0;transition:opacity .2s}
.app.on .ico,.app:focus .ico,.app:hover .ico{animation-play-state:paused;transform:translateY(-.9vw) scale(1.12);
  box-shadow:0 2.4vw 3.4vw rgba(0,0,0,.6),0 0 0 .28vw rgba(255,255,255,.85),0 0 2.2vw .35vw var(--halo,rgba(125,211,252,.45))}
.app.on .name,.app:focus .name,.app:hover .name{color:var(--text)}
.app.on .key,.app:focus .key,.app:hover .key{opacity:1}
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div>

<div class="wrap">
  <section class="top">
    <a class="card portal" id="portal" href="#" aria-label="Open Tesla Power Flow full screen">
      <div class="loading">Loading Tesla Power Flow…</div>
      <iframe id="portalFrame" title="Tesla Power Flow" tabindex="-1" loading="eager"></iframe>
      <span class="hint">OK to open full screen ⤢</span>
    </a>
  </section>

  <nav class="apps" id="apps"></nav>
</div>

<script>
/* ============================================================
   HUB_CONFIG: the only part you need to edit.
   portal = the live dashboard shown in the big panel.
   key    = the number you gave that app in LG Quick Access (hold 0 on the remote). "" = none.
   ============================================================ */
var HUB_CONFIG = {
  portal: { url:"https://portal-home-api.arvargas78.workers.dev/", designWidth:1600 },
  apps: [
    { name:"Tesla",       url:"https://portal-home-api.arvargas78.workers.dev/", icon:"tesla", bg:"linear-gradient(150deg,#e82127,#7a0b0f)", halo:"rgba(232,33,39,.5)", key:"" },
    { name:"Netflix",     url:"https://www.netflix.com",    icon:"netflix", bg:"linear-gradient(150deg,#1a1a1a,#000)",    halo:"rgba(229,9,20,.5)",    key:"2" },
    { name:"YouTube",     url:"https://www.youtube.com/tv", icon:"youtube", bg:"linear-gradient(150deg,#ffffff,#e6e6e6)", halo:"rgba(255,0,0,.45)",    key:"3" },
    { name:"Prime Video", url:"https://www.primevideo.com", icon:"prime",   bg:"linear-gradient(150deg,#1fb6ff,#0a5c9e)", halo:"rgba(0,168,225,.5)",   key:"4" },
    { name:"Disney+",     url:"https://www.disneyplus.com", icon:"disney",  bg:"linear-gradient(150deg,#1b3c8f,#040d36)", halo:"rgba(64,120,255,.5)",  key:"5" },
    { name:"Apple TV",    url:"https://tv.apple.com",       icon:"appletv", bg:"linear-gradient(150deg,#3a3a3c,#0b0b0c)", halo:"rgba(255,255,255,.35)",key:"6" },
    { name:"Peacock",     url:"https://www.peacocktv.com",  icon:"peacock", bg:"linear-gradient(150deg,#1c1c1e,#000)",    halo:"rgba(255,180,0,.4)",   key:"7" },
    { name:"Spotify",     url:"https://open.spotify.com",   icon:"spotify", bg:"linear-gradient(150deg,#1a1a1a,#050505)", halo:"rgba(30,215,96,.5)",   key:"8" },
    { name:"iHeartRadio", url:"https://www.iheart.com",     icon:"iheart",  bg:"linear-gradient(150deg,#ff3b4a,#b3001b)", halo:"rgba(200,16,46,.5)",   key:"" },
    { name:"Photos",      url:"https://photos.google.com",  icon:"photos",  bg:"linear-gradient(150deg,#ffffff,#eceff3)", halo:"rgba(66,133,244,.45)", key:"" }
  ]
};

/* ---------- app icons (drawn here, nothing to download) ---------- */
var ICONS = {
  tesla:'<svg viewBox="0 0 100 100"><path fill="#fff" d="M50 30c11 0 22 1.6 30 4.4l-2.6 4.6c-6-2-13-3.2-20.6-3.6L50 80l-6.8-44.6C35.6 35.8 28.6 37 22.6 39L20 34.4C28 31.6 39 30 50 30zm0-10c14 0 27.6 2 38 5.8l-2.2 4C76 26.4 63.6 24.6 50 24.6S24 26.4 14.2 29.8l-2.2-4C22.4 22 36 20 50 20z"/></svg>',
  netflix:'<svg viewBox="0 0 100 100"><path fill="#e50914" d="M30 14h14l12 36V14h14v72c-4.4-.6-9-1-13.6-1.2L44 50v35.4c-4.8.2-9.6.6-14 1.2z"/><path fill="#b1060f" d="M30 14h14v71.4c-4.8.2-9.6.6-14 1.2z"/></svg>',
  youtube:'<svg viewBox="0 0 100 100"><rect x="12" y="24" width="76" height="52" rx="15" fill="#ff0000"/><path d="M43 37v26l22-13z" fill="#fff"/></svg>',
  prime:'<span class="word" style="font-size:1.6em;letter-spacing:-.04em;margin-top:-1vw">prime</span><svg viewBox="0 0 100 40" style="position:absolute;bottom:20%;width:56%;height:auto"><path d="M10 10 Q50 34 88 12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M80 6 l10 5 -6 9" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  disney:'<span class="word" style="font-size:1.6em;font-style:italic;font-family:Georgia,serif;font-weight:700">Disney<span style="color:#7fd4ff">+</span></span>',
  appletv:'<span class="word" style="font-size:2.3em;font-weight:600;letter-spacing:-.05em">tv</span>',
  peacock:'<svg viewBox="0 0 100 100"><g transform="translate(50 74) scale(1.45)"><circle r="7" fill="#fff"/><circle r="8" cx="-26" cy="-14" fill="#fccc12"/><circle r="8" cx="-19" cy="-30" fill="#ef1541"/><circle r="8" cx="-6" cy="-40" fill="#6e55dc"/><circle r="8" cx="8" cy="-40" fill="#069de0"/><circle r="8" cx="20" cy="-30" fill="#05ac3f"/><circle r="8" cx="27" cy="-14" fill="#ff7112"/></g></svg>',
  spotify:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#1ed760"/><g stroke="#000" stroke-linecap="round" fill="none"><path d="M27 39c16-5 34-4 48 4" stroke-width="7"/><path d="M30 52c13-4 28-3 40 4" stroke-width="6"/><path d="M33 64c10-3 21-2 31 3" stroke-width="5"/></g></svg>',
  iheart:'<svg viewBox="0 0 100 100"><path fill="#fff" d="M50 82S16 62 16 38c0-11 8-19 18-19 7 0 12 4 16 9 4-5 9-9 16-9 10 0 18 8 18 19 0 24-34 44-34 44z"/><path d="M38 44c3-3 7-3 10 0M62 44c-3-3-7-3-10 0" stroke="#c8102e" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="50" cy="48" r="4" fill="#c8102e"/></svg>',
  photos:'<svg viewBox="0 0 100 100"><path d="M50 50V18a16 16 0 0 1 0 32z" fill="#ea4335"/><path d="M50 50h32a16 16 0 0 1-32 0z" fill="#4285f4"/><path d="M50 50v32a16 16 0 0 1 0-32z" fill="#34a853"/><path d="M50 50H18a16 16 0 0 1 32 0z" fill="#fbbc04"/></svg>'
};

/* ---------- background glow follows the time of day (the clock lives in the portal) ---------- */
function glows(h){
  var r=document.documentElement.style,g;
  if(h<6||h>=20)g=["rgba(99,102,241,.18)","rgba(30,64,175,.16)"];
  else if(h<9||h>=17)g=["rgba(251,146,60,.20)","rgba(236,72,153,.15)"];
  else g=["rgba(56,189,248,.20)","rgba(250,204,21,.09)"];
  r.setProperty("--glow1",g[0]);r.setProperty("--glow2",g[1]);
}
glows(new Date().getHours());
setInterval(function(){glows(new Date().getHours())},10*60*1000);

/* ---------- live portal panel: drawn at a desktop size, then scaled to fit ---------- */
var portal=document.getElementById("portal"),frame=document.getElementById("portalFrame");
portal.href=HUB_CONFIG.portal.url;
frame.onload=function(){var l=portal.querySelector(".loading");l&&l.parentNode.removeChild(l)};
frame.src=HUB_CONFIG.portal.url;
function fitPortal(){
  var w=portal.clientWidth,h=portal.clientHeight,dw=HUB_CONFIG.portal.designWidth,s=w/dw;
  frame.style.width=dw+"px";frame.style.height=Math.ceil(h/s)+"px";frame.style.transform="scale("+s+")";
}
fitPortal();window.addEventListener("resize",fitPortal);
setInterval(function(){frame.src=HUB_CONFIG.portal.url},6*60*60*1000); // fresh reload every 6 hours

/* ---------- app icons ---------- */
var appsEl=document.getElementById("apps");
HUB_CONFIG.apps.forEach(function(a,i){
  var el=document.createElement("a");el.className="app";el.href=a.url;el.style.setProperty("--halo",a.halo);
  el.innerHTML='<div class="ico" style="--bg-app:'+a.bg+';--d:'+(-i*0.6)+'s">'+(ICONS[a.icon]||'<span class="word">'+a.name.charAt(0)+'</span>')+
    (a.key?'<span class="key">Hold '+a.key+'</span>':'')+'</div><div class="name">'+a.name+'</div>';
  appsEl.appendChild(el);
});

/* ---------- remote navigation (arrows + OK) ---------- */
function focusables(){return [].slice.call(document.querySelectorAll(".app,.portal"))}
function mark(el){var o=document.querySelector(".on");if(o&&o!==el)o.classList.remove("on");if(el&&(el.classList.contains("app")||el.classList.contains("portal")))el.classList.add("on")}
document.addEventListener("focusin",function(e){mark(e.target)});
function focusFirst(){var f=document.querySelector(".app");if(f){f.focus();mark(f)}}
document.addEventListener("keydown",function(e){
  var dir={37:"l",38:"u",39:"r",40:"d"}[e.keyCode];if(!dir)return;
  var cur=document.activeElement,items=focusables();
  if(!cur||items.indexOf(cur)<0){focusFirst();e.preventDefault();return}
  var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bs=1e9;
  items.forEach(function(el){if(el===cur)return;var b=el.getBoundingClientRect(),dx=b.left+b.width/2-ax,dy=b.top+b.height/2-ay;
    if(!(dir==="l"?dx<-5:dir==="r"?dx>5:dir==="u"?dy<-5:dy>5))return;
    var hz=dir==="l"||dir==="r",sc=(hz?Math.abs(dx):Math.abs(dy))+(hz?Math.abs(dy):Math.abs(dx))*(hz?2.5:0.3);if(sc<bs){bs=sc;best=el}});
  if(best){best.focus();mark(best);e.preventDefault()}
});
focusFirst();
</script>
</body>
</html>
